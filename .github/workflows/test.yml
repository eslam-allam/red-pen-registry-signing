name: Test signer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signer-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install pinned minisign
        env:
          MINISIGN_VERSION: "0.12"
          MINISIGN_SHA256: "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/minisign.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/jedisct1/minisign/releases/download/${MINISIGN_VERSION}/minisign-${MINISIGN_VERSION}-linux.tar.gz" \
            --output "${archive}"
          echo "${MINISIGN_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/minisign-linux/x86_64/minisign" "${RUNNER_TEMP}/minisign"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
          echo "MINISIGN_BIN=${RUNNER_TEMP}/minisign" >> "${GITHUB_ENV}"

      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run tests
        run: python tests/run.py

      - name: Check package imports
        run: python -c "from redpen_signing import __version__; print(__version__)"
