[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redpen-registry-signing"
version = "1.0.0"
description = "Pinned minisign signing and verification helpers for Red Pen adapter registries"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Red Pen contributors" }]
dependencies = ["jsonschema>=4.18,<5"]

[tool.setuptools]
packages = ["redpen_signing"]

[tool.setuptools.package-data]
redpen_signing = ["schemas/*.json"]
